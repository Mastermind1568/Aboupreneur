kind = "web"
previewPath = "/"
title = "Dan Koe"
version = "1.0.0"
id = "artifacts/dankoe"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21137
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/dankoe run dev"

[services.env]
PORT = "21137"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/dankoe", "run", "build"]
publicDir = "artifacts/dankoe/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
